services:
  - type: web
    name: xingzhi-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: XingZhi Backend
      - key: DEBUG
        value: "false"
      - key: MYSQL_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_USER
        value: 2Erny1PcLAcZciH.root
      - key: MYSQL_DATABASE
        value: xingzhi
      - key: SECRET_KEY
        value: xz2026-backend-secure-k3y
      - key: CORS_ORIGINS
        value: "https://xingzhi-smart-travel-platform.onrender.com"
      # 以下请在 Render 网页端手动填写（不要放真实值到 Git 仓库）
      - key: MYSQL_PASSWORD
        sync: false
      - key: OPENWEATHER_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
